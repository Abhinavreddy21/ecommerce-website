<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://kit.fontawesome.com/65545bc01c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="comercestyle.css">
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <a class="navbar-brand">
            <img class="logo" src="logo.png"  alt="">
        </a>
            <form class="form-inline">
                <select class="categories_select" onchange="location.href=this.value;">
                    <option value="">All categories</option>
                    <option value="men.html">Men</option>
                    <option value="women.html">Women</option>
                    <option value="electronics.html">Electronics</option>
                    <option value="living.html">Living</option>
                </select>
                <input type="search" placeholder="Search for products" class="search_button">
            </form>
            
            <button class="login mr-3"> <i class="fa-solid fa-user user_icon"></i>Login/ <br> Sign up</button>
            <p class="mr-3"><i class="fa-solid fa-cart-shopping"></i>My cart</p>
    </nav>
    <div class="details_bg">
        <div class="d-flex flex-row">
            <div class="details_image">
                <img src="striped shirt.png" alt="">
            </div>
            <div class="Product_info">
                <div class="brand_info">
                    <h4 class="brand_title">Fashonize</h4>
                    <p class="brand_para">Slim Fit Striped Pure Cotton Casual Shirt</p>
                    <p class="rating">4.5 ⭐</p>
                    <hr>
                    <span class="cost">₹2099</span>
                    <span class="old_cost">₹2999</span>
                    <div class="size">
                        <h3 class="select_size">Select Size</h3>
                        <button class="size_button">XS</button>
                        <button class="size_button">S</button>
                        <button class="size_button">M</button>
                        <button class="size_button">L</button>
                        <button class="size_button">XL</button>
                    </div>
                    <div class="cart">
                        <button class="add_cart">🛒 Add to Bag</button>
                        <button class="wishlist"> Wishlist</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
